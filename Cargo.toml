[package]
name = "kj-flow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Human-agent software development workflows across multiple Git repositories"
license = "Apache-2.0"
repository = "https://github.com/kaojai-ai/kj-flow"
homepage = "https://kaojai.ai"
readme = "README.md"
keywords = ["git", "worktree", "codex", "agents", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kj"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serial_test = "3.2"
tempfile = "3.23"
