name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Verify source
        run: make check

      - name: Package native binary
        run: make package-release TARGET=${{ matrix.target }} DIST_DIR=dist

      - name: Verify installer
        run: make test-installer

      - uses: actions/upload-artifact@v7
        with:
          name: kj-${{ matrix.target }}
          path: dist/kj-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        run: |
          cp scripts/install.sh dist/kj-installer.sh
          cd dist
          sha256sum kj-*.tar.gz > kj-checksums.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "KJ Flow ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
